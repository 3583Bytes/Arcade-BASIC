name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name to use for the release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

# Keyed on the ref, so distinct tags never cancel each other; only a re-push
# of the same tag supersedes its in-progress run (freeing macOS runner slots).
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Native AOT binaries — one per (OS, RID). Each runner produces a single
  # self-contained executable that needs no .NET runtime installed.
  # -------------------------------------------------------------------------
  aot:
    name: AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          - os: macos-latest
            rid: osx-arm64
            ext: ''
          - os: windows-latest
            rid: win-x64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version label
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then name="${GITHUB_REF#refs/tags/}"; else name="${{ inputs.tag }}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=${name#v}" >> "$GITHUB_OUTPUT"      # v2.0.0 → 2.0.0

      - name: Publish AOT
        shell: bash
        run: |
          # PublishAot is set on the CLI's csproj (project-level), so we
          # DON'T pass -p:PublishAot=true on the command line — that would
          # promote it to a global MSBuild property and propagate into the
          # netstandard2.1 builds of the multi-targeted libs, which can't AOT.
          # The version, though, is everyone's: arcade-basic --version reports the tag.
          dotnet publish src/ArcadeBasic.Cli \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            -p:Version=${{ steps.ver.outputs.version }} \
            --output publish/aot

      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          cli=./publish/aot/arcade-basic${{ matrix.ext }}
          "$cli" --version | tee version.txt
          grep -F "arcade-basic ${{ steps.ver.outputs.version }}" version.txt
          "$cli" run examples/hello.bas
          # A standalone program, built by the binary we're shipping, runs on this OS.
          "$cli" build examples/hello.bas -o hello${{ matrix.ext }}
          ./hello${{ matrix.ext }} | tee hello.txt
          grep -F "answer is 42" hello.txt

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp publish/aot/arcade-basic${{ matrix.ext }} \
             artifacts/arcade-basic-${{ steps.ver.outputs.name }}-${{ matrix.rid }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.rid }}
          path: artifacts/

  # -------------------------------------------------------------------------
  # Collect every artifact and attach to a GitHub release.
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub release
    needs: [aot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then name="${GITHUB_REF#refs/tags/}"; else name="${{ inputs.tag }}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=${name#v}" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          # This version's section: from its "## <version>" heading to the next "## ".
          awk -v v="${{ steps.tag.outputs.version }}" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::warning::CHANGELOG.md has no section for ${{ steps.tag.outputs.version }}"
            : > notes.md
          fi
          cat notes.md

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: notes.md
          generate_release_notes: true      # (after the notes: the commits since the last release)
          files: dist/*
