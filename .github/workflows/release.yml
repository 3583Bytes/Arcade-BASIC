name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name to use for the release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

# Keyed on the ref, so distinct tags never cancel each other; only a re-push
# of the same tag supersedes its in-progress run (freeing macOS runner slots).
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Native AOT binaries — one per (OS, RID). Each runner produces a single
  # self-contained executable that needs no .NET runtime installed.
  # -------------------------------------------------------------------------
  aot:
    name: AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          - os: macos-latest
            rid: osx-arm64
            ext: ''
          - os: macos-13
            rid: osx-x64
            ext: ''
          - os: windows-latest
            rid: win-x64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish AOT
        shell: bash
        run: |
          # PublishAot is set on the CLI's csproj (project-level), so we
          # DON'T pass -p:PublishAot=true on the command line — that would
          # promote it to a global MSBuild property and propagate into the
          # netstandard2.1 builds of the multi-targeted libs, which can't AOT.
          dotnet publish src/ArcadeBasic.Cli \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --output publish/aot

      - name: Smoke-test the binary
        shell: bash
        run: |
          ./publish/aot/arcade-basic${{ matrix.ext }} --version
          ./publish/aot/arcade-basic${{ matrix.ext }} run examples/hello.bas

      - name: Resolve version label
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp publish/aot/arcade-basic${{ matrix.ext }} \
             artifacts/arcade-basic-${{ steps.ver.outputs.name }}-${{ matrix.rid }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.rid }}
          path: artifacts/

  # -------------------------------------------------------------------------
  # Arcade BASIC IDE — Terminal.Gui v1 isn't AOT-clean, so the IDE ships
  # self-contained single-file binaries (the .NET runtime is bundled). The
  # resulting binary needs no .NET install on the target machine.
  # -------------------------------------------------------------------------
  ide:
    name: IDE (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          - os: macos-latest
            rid: osx-arm64
            ext: ''
          - os: macos-13
            rid: osx-x64
            ext: ''
          - os: windows-latest
            rid: win-x64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained
        shell: bash
        run: |
          dotnet publish src/ArcadeBasic.Ide \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output publish/ide

      - name: Smoke-test the binary
        shell: bash
        run: |
          ./publish/ide/arcade-basic-ide${{ matrix.ext }} --version

      - name: Resolve version label
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp publish/ide/arcade-basic-ide${{ matrix.ext }} \
             artifacts/arcade-basic-ide-${{ steps.ver.outputs.name }}-${{ matrix.rid }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ide-${{ matrix.rid }}
          path: artifacts/

  # -------------------------------------------------------------------------
  # Unity asset package — bundle the netstandard2.1 DLLs into unity/ and
  # zip the whole package for distribution via UPM (git URL) or manual
  # extract into a project's Packages folder.
  # -------------------------------------------------------------------------
  unity:
    name: Unity package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Wait for every per-RID AOT build to finish — we bundle the resulting
    # arcade-basic binaries into the Unity package's Samples~ folder so the
    # IDE's Build Standalone feature works as soon as the user imports the
    # "Arcade BASIC IDE" sample via Package Manager.
    needs: [aot]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Populate unity/Runtime/Plugins with netstandard2.1 DLLs
        shell: bash
        run: ./unity/scripts/copy-dlls.sh

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download AOT artifacts (built by the `aot` matrix jobs)
        uses: actions/download-artifact@v4
        with:
          pattern: aot-*
          path: aot-artifacts
          merge-multiple: true

      - name: Stage AOT stubs into Unity Samples~/ArcadeBasic/Stubs
        shell: bash
        run: |
          # The aot jobs upload binaries named arcade-basic-<version>-<rid>[.exe]
          # (one per RID). The Unity sample expects them as arcade-basic-<rid>
          # under Samples~/ArcadeBasic/Stubs/ — strip the version suffix.
          STUBS="unity/Samples~/ArcadeBasic/Stubs"
          VER="${{ steps.ver.outputs.name }}"
          mkdir -p "$STUBS"
          for rid in linux-x64 osx-arm64 osx-x64; do
            cp "aot-artifacts/arcade-basic-$VER-$rid" "$STUBS/arcade-basic-$rid"
            chmod +x "$STUBS/arcade-basic-$rid"
          done
          cp "aot-artifacts/arcade-basic-$VER-win-x64.exe" "$STUBS/arcade-basic-win-x64.exe"
          ls -lh "$STUBS"

      - name: Zip package
        shell: bash
        run: |
          mkdir -p artifacts
          zip -r "artifacts/arcade-basic-unity-${{ steps.ver.outputs.name }}.zip" unity \
            -x 'unity/scripts/*' \
            -x '*.DS_Store' \
            -x '*.pdb'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-package
          path: artifacts/

  # -------------------------------------------------------------------------
  # Collect every artifact and attach to a GitHub release.
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub release
    needs: [aot, ide, unity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: dist/*
