name: Playground (GitHub Pages)

# Builds the browser playground (src/ArcadeBasic.Web, the VM compiled ahead of time
# to WebAssembly) and publishes it to GitHub Pages. Needs Pages turned on with
# "GitHub Actions" as the source (Settings → Pages).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the playground
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the WebAssembly build tools (ahead-of-time compilation)
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/ArcadeBasic.Web --configuration Release --output publish/web

      # Pages serves files as they are, so the pre-compressed .br/.gz copies would
      # never be used; and nothing here is for Jekyll (which would hide _framework).
      - name: Keep only what the page loads
        run: |
          find publish/web/wwwroot -name '*.br' -delete
          find publish/web/wwwroot -name '*.gz' -delete
          touch publish/web/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/web/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
