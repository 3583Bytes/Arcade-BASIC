name: Playground (GitHub Pages)

# Builds the website and publishes it to GitHub Pages: the browser IDE
# (src/ArcadeBasic.Web, the VM compiled ahead of time to WebAssembly), the player that
# File → Export packs programs with (src/ArcadeBasic.Player, in player/), and the desktop
# players for its Mac, Windows and Linux apps (desktop/player, in desktop/) — all from the
# same commit, so what the IDE compiles is what the players run. Needs Pages turned on
# with "GitHub Actions" as the source (Settings → Pages).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'desktop/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    name: Build the IDE and the player
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the WebAssembly build tools (ahead-of-time compilation)
        run: dotnet workload install wasm-tools

      - name: Build the site (the IDE, and the player in player/)
        run: bash src/ArcadeBasic.Web/build-site.sh publish/site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: publish/site
          include-hidden-files: true      # (.nojekyll)

  # The desktop players, each built on its own OS around the site's player page. One that
  # fails to build is left out — the IDE offers apps for the players there are — rather
  # than holding up the site.
  desktop:
    name: Desktop player (${{ matrix.os }})
    needs: site
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-22.04          # (an older glibc and WebKitGTK: runs on more Linuxes)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: publish/site

      - name: What Tauri builds against on Linux (WebKitGTK)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Both Mac processors (one universal app)
        if: matrix.os == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/player

      - name: Build the player
        shell: bash
        run: |
          bash desktop/player/build.sh --page publish/site/player ${{ matrix.os == 'macos' && '--universal' || '' }} | tee build.log
          mkdir -p out
          cp "$(tail -n 1 build.log | sed 's/^built //')" out/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/

      # File → Export writes a game's icon into the Windows player, over the placeholder it's
      # built with (desktop/player/icons). Check Windows reads both: the player's own (green
      # in the middle), then a test icon written the same way (orange above, blue below). A
      # failure doesn't stop the player being published; Windows apps' icons need a look.
      - uses: actions/setup-node@v4
        if: matrix.os == 'windows'
        with:
          node-version: 22
      - name: Check the Windows icon
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          function Pixels($exe) {
            $bitmap = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path).ToBitmap()
            $x = [int]($bitmap.Width / 2)
            return @($bitmap.GetPixel($x, 2), $bitmap.GetPixel($x, [int]($bitmap.Height / 2)), $bitmap.GetPixel($x, $bitmap.Height - 3))
          }
          $own = Pixels "out/arcade-player.exe"
          "The player's own icon (top, middle, bottom): $own"
          if ($own[1].G -lt 200 -or $own[1].R -gt 150) { throw "the player's icon isn't Arcade BASIC's" }
          node desktop/player/icons/check-windows-icon.mjs out/arcade-player.exe checked.exe
          $test = Pixels "checked.exe"
          "The test icon (top, middle, bottom): $test"
          if ($test[0].R -lt 200 -or $test[0].B -gt 80 -or $test[2].B -lt 200 -or $test[2].R -gt 80) { throw "Windows doesn't read the icon written into the player" }

  publish:
    name: Put the site together
    needs: [site, desktop]
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: publish/site

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: publish/players
        continue-on-error: true           # (none built: the site without desktop apps)

      - name: Add the desktop players (desktop/)
        shell: bash
        run: |
          shopt -s nullglob
          players=(publish/players/*/*)
          bash desktop/player/add-to-site.sh publish/site "${players[@]}"
          cat publish/site/desktop/players.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/site

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
