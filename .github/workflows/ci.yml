name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings-as-errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run example programs (smoke)
        shell: bash
        run: |
          set -euo pipefail
          for ex in hello factorial fibonacci primes strings pi; do
            echo "::group::run examples/${ex}.bas"
            dotnet run --project src/FullBasic.Cli --configuration Release --no-build -- run examples/${ex}.bas
            echo "::endgroup::"
          done
