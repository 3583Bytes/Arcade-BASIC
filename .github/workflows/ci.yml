name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same ref cancels an in-progress run, freeing the scarce
# macOS runner slots instead of letting stale runs hold the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings-as-errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run example programs (smoke)
        shell: bash
        run: |
          set -euo pipefail
          for ex in hello factorial fibonacci primes strings pi; do
            echo "::group::run examples/${ex}.bas"
            dotnet run --project src/ArcadeBasic.Cli --configuration Release --no-build -- run examples/${ex}.bas
            echo "::endgroup::"
          done

      - name: REPL smoke test
        shell: bash
        run: |
          set -euo pipefail
          actual=$(printf 'LET X = 6\nPRINT X * 7\n.exit\n' \
            | dotnet run --project src/ArcadeBasic.Cli --configuration Release --no-build -- repl)
          echo "$actual"
          echo "$actual" | grep -q '42' || { echo "REPL did not print 42"; exit 1; }
          echo "$actual" | grep -q 'bye\.' || { echo "REPL did not exit cleanly"; exit 1; }

      - name: Unity DLL bundle (netstandard2.1 publish smoke)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./unity/scripts/copy-dlls.sh
          # Sanity: the directory has at least the ArcadeBasic core libs + BigDecimal.
          for required in ArcadeBasic.Core.dll ArcadeBasic.Interpreter.dll Singulink.Numerics.BigDecimal.dll; do
            test -f "unity/Runtime/Plugins/$required" \
              || { echo "Unity bundle missing $required"; exit 1; }
          done
